[project]
name = "ops-pilot-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "opspilot-schemas",
    "opspilot-agent",
    "opspilot-tools",
    "opspilot-telemetry",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "email-validator>=2.3.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "testcontainers[postgres,redis]>=4.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
opspilot-schemas = { workspace = true }
opspilot-agent = { workspace = true }
opspilot-tools = { workspace = true }
opspilot-telemetry = { workspace = true }

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring Docker/testcontainers",
]
testpaths = ["tests"]
addopts = "-m 'not integration' --cov=app --cov-report=term-missing"

[dependency-groups]
dev = [
    "fakeredis>=2.37.0",
]
