[project]
name = "ops-pilot-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26.1",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "opspilot-schemas",
    "opspilot-telemetry",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.uv.sources]
opspilot-schemas = { workspace = true }
opspilot-telemetry = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring Docker/testcontainers",
]
testpaths = ["tests"]
addopts = "-m 'not integration' --cov=worker --cov-report=term-missing --cov-fail-under=80"
