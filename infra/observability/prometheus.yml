global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: demo-service
    static_configs:
      - targets: ["demo-service:8080"]
    metrics_path: /metrics

  - job_name: opspilot-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: opspilot-worker
    static_configs:
      - targets: ["worker:9091"]
    metrics_path: /metrics
