[project]
name = "opspilot-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "opspilot-schemas",
    "opspilot-tools",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.uv.sources]
opspilot-schemas = { workspace = true }
opspilot-tools = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=opspilot.agent --cov-report=term-missing --cov-fail-under=60"
