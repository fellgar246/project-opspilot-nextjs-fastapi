[project]
name = "opspilot-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "opspilot-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.uv.sources]
opspilot-schemas = { workspace = true }
